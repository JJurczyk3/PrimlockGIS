[project]
name = "primlockgis"
version = "0.1.1"
description = "A lightweight terminal-based GIS prototype."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.40.1",
]

[dependency-groups]
dev = [
    "pyinstaller==6.21.0",
    "pypdfium2==5.11.0",
    "reportlab==4.4.9",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["primelock_gis"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
